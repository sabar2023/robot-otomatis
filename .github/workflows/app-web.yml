name: BrandBisnis App (Build Web)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Web
        working-directory: app
        run: flutter build web --release

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: brandbisnis-app-web
          path: app/build/web
          retention-days: 30