name: BrandBisnis VST Bot (M5 Cron)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Kirim pesan tes Telegram saja"
        type: boolean
        default: false

jobs:
  vst-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M5 VST scan (BingX VST)
        env:
          VST_LIVE: ${{ vars.VST_LIVE || '0' }}
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jklbczruvbxscpwxxfud.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          if [ "$TEST_TELEGRAM" = "true" ]; then
            python3 vst/main.py --test-telegram
          else
            python3 vst/main.py
          fi
