name = "brandbisnis-worker"
main = "worker.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "brandbisnis"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "brandbisnis-backups"

[vars]
WORKER_TOKEN = "REPLACE_WITH_SECRET_TOKEN"
